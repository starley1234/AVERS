# AVERS Configuration Template
# Copy and customize for your needs
# v0.2.0 - with Web UI, Dataset, Vision RAG

project_name: AVERS
version: "0.2.0"

# Logging
log_level: INFO
log_file: null  # Set to path for file logging

# Stage 1: SAHI-based Image Slicing
slicing:
  tile_size: 1024              # Tile size in pixels
  overlap_ratio: 0.2          # Overlap between tiles (0.0-0.5)
  target_stride: null          # Override stride calculation
  min_tile_area: 100           # Minimum tile area to process

# Stage 2: Object Detection (RT-DETR/YOLO)
detection:
  model_path: null             # Веса ОБУЧЕННОЙ модели, напр. /tmp/avers_runs/avers_yolo/weights/best.pt
                               # (null = COCO-модель по умолчанию - на ГОСТ УГО она НЕ обучена, будут предупреждения)
  model_type: yolo              # 'yolo' or 'rtdetr'
  model_name: yolov11x
  confidence_threshold: 0.25
  iou_threshold: 0.45
  device: cuda                 # 'cuda', 'cpu', 'mps'
  batch_size: 4
  img_size: 640

# Stage 3: OCR (PaddleOCR)
ocr:
  enabled: true
  lang: ru                     # Language: 'ru', 'en', 'ch'
  text_confidence_threshold: 0.65
  enable_angle_cls: true       # Enable text direction classification
  allowed_rotations: [0, 90, 180, 270]
  connector_pattern: "^[ХX]\\d+$"
  pin_pattern: "^\\d+$"
  wire_pattern: "^БПВЛ(-\\d+(\\.\\d+)?)?$"

# Stage 4: Wire Vectorization (OpenCV)
vectorization:
  enabled: true
  line_thickness_threshold: 3
  skeletonize_method: guo_hall  # 'guo_hall' or 'zhang_suen'
  rdp_epsilon: 2.0              # Ramer-Douglas-Peucker epsilon
  junction_degree_threshold: 3
  snap_radius: 15

# Stage 5: Graph Synthesis (NetworkX)
graph_synthesis:
  enabled: true
  snap_enabled: true           # Enable wire-to-pin snapping
  snap_radius: 15              # Snap radius in pixels
  text_association_radius: 50  # Max distance for text-to-component association
  merge_collinear_segments: true
  merge_tolerance: 5.0         # Tolerance for collinear merge

# Stage 6: VLM Arbitration
vlm_arbitrator:
  enabled: true
  model_name: Qwen/Qwen2.5-VL-7B-Instruct  # Локальная модель (HuggingFace), если provider != api
  device: cuda
  roi_size: 256                # ROI crop size
  confidence_threshold: 0.65   # Min confidence to trigger VLM
  max_vlm_calls: 50            # Cost control

  # Внешняя LLM через OpenAI-совместимый API (OpenAI, OpenRouter, vLLM, Ollama, LM Studio)
  # Те же значения можно задать через env: AVERS_VLM_PROVIDER, AVERS_VLM_API_BASE,
  # AVERS_VLM_API_KEY, AVERS_VLM_API_MODEL, AVERS_VLM_API_TIMEOUT
  provider: auto               # auto | api | local | mock (auto = API если задан api_base, иначе локально)
  api_base: null               # напр. https://api.openai.com/v1 или http://localhost:11434/v1
  api_key: null                # Bearer-ключ (для OpenRouter/OpenAI); локальным серверам часто не нужен
  api_model: null              # имя модели у провайдера, напр. gpt-4o-mini или qwen2.5vl:7b
  api_timeout: 60              # сек

# Vision RAG (NEW in v0.2)
vision_rag:
  enabled: true
  embedding_model: openai/clip-vit-base-patch32
  vector_store: faiss          # 'faiss' or 'memory'
  top_k: 5                     # Number of examples to retrieve
  use_few_shot: true           # Use examples in VLM prompt
  storage_path: /tmp/avers_rag
  min_similarity: 0.3          # Min similarity to use example

# Dataset Generation (NEW in v0.2)
dataset:
  output_dir: /tmp/avers_dataset
  image_size: 1024
  num_train: 1000
  num_val: 200
  num_test: 100
  classes:
    - connector_body
    - pin
    - junction_dot
    - ground
    - shield
    - offpage_connector
    - diode
    - relay
    - resistor
  enable_wires: true
  enable_text: true
  enable_scan_effects: true
  enable_noise: true

# Training (NEW in v0.2)
training:
  model_type: rtdetr-l         # 'yolo11x', 'yolo11m', 'rtdetr-l', 'rtdetr-x'
  epochs: 100
  batch_size: 8
  img_size: 640
  device: cuda
  project: /tmp/avers_runs
  pretrained: null             # Path to pretrained weights

# Web UI (NEW in v0.2)
web:
  host: 0.0.0.0
  port: 8000
  reload: false
  workers: 1
  upload_dir: /tmp/avers_uploads
  results_dir: /tmp/avers_results
  max_file_size_mb: 50

# Output Format
output:
  default_format: json         # 'json' or 'xml'
  json_indent: 2
  include_intermediate_stages: false
  output_dir: null
