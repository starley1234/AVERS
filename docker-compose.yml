version: '3.8'

services:
  avers-web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - avers_uploads:/tmp/avers_uploads
      - avers_results:/tmp/avers_results
      - avers_dataset:/tmp/avers_dataset
      - avers_rag:/tmp/avers_rag
      - avers_feedback:/tmp/avers_feedback
    environment:
      - AVERS_LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Qdrant for production RAG (instead of FAISS)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    profiles:
      - with-qdrant

  # Optional: MinIO for dataset storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=avers
      - MINIO_ROOT_PASSWORD=avers12345
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    profiles:
      - with-minio

volumes:
  avers_uploads:
  avers_results:
  avers_dataset:
  avers_rag:
  avers_feedback:
  qdrant_storage:
  minio_data:
